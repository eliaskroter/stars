}
function scatter(){
  const order=parts.map(p=>[p.imp+Math.random()*.9,p]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const cells=TXT.slice().sort(()=>Math.random()-.5);
  for(const p of parts)p.star=false;
  order.slice(0,cells.length).forEach((p,i)=>{p.star=true;p.gx=cells[i][0];p.gy=cells[i][1]});
  for(const p of parts){
    p.big=p.star&&Math.random()<.06;p.dl=Math.random()*.4;
    const a=rnd(0,6.28),rad=rnd(.08,1)**.55;
    p.tx=X0+VC/2+Math.cos(a)*rad*VC*.55;
    p.ty=Y0+VR/2+Math.sin(a)*rad*VR*.5;
    p.sw=rnd(-10,10);
  }
}

const PH=[['eye',5],['out',3.4],['sky',2.4],['form',3],['text',5],['in',3.8]];
const TOTAL=PH.reduce((s,p)=>s+p[1],0);
let t0=performance.now()/1000,cycle=0;
function phaseAt(t){let a=0;for(const[n,d]of PH){if(t<a+d)return[n,(t-a)/d,t-a];a+=d}return['eye',0,0]}

function fit(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  const aw=innerWidth-16,ah=innerHeight-24;
  portrait=aw<ah;
  if(portrait){
    X0=21;VC=90;                       // crop the skin at the sides: the eye fills the width
    fs=aw/(VC*.6);
    VR=Math.max(ROWS,Math.floor(ah/(fs*1.12)));
    Y0=-(VR-ROWS)/2;
  }else{
    X0=0;VC=COLS;Y0=0;VR=ROWS;
    fs=Math.max(3,Math.min(aw/(COLS*.6),ah*.94/(ROWS*1.12),18));
  }
  cw=fs*.6;chh=fs*1.12;
  const w=Math.round(VC*cw),h=Math.round(VR*chh);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const key=portrait+':'+VR;
  if(key!==layoutKey){layoutKey=key;TXT=textCells();scatter()}
}
addEventListener('resize',fit);fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

const mix=(a,b,t)=>`rgb(${a[0]+(b[0]-a[0])*t|0},${a[1]+(b[1]-a[1])*t|0},${a[2]+(b[2]-a[2])*t|0})`;

function frame(now){
  const T=now/1000,el=T-t0,c=Math.floor(el/TOTAL);
  if(c!==cycle){cycle=c;scatter()}
  const[ph,f,secs]=phaseAt(el%TOTAL);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.textBaseline='top';
  const font=`600 ${fs}px "IBM Plex Mono",ui-monospace,Menlo,monospace`;
  ctx.font=font;
  // faint background sky
  const W=VC*cw,H=VR*chh;
  for(const s of sky){const v=Math.sin(T*s.sp+s.tw);ctx.fillStyle=`rgba(120,128,180,${.25+.25*v})`;ctx.fillText(v>.7?'+':'.',s.x*W,s.y*H)}
  ctx.translate(-X0*cw,-Y0*chh);
  // a slow blink while she's looking at you
  let open=1;
  if(ph==='eye'){const b=(secs-2.6)/.42;if(b>0&&b<1)open=Math.abs(Math.cos(b*Math.PI))}
  for(const p of parts){
    if(ph==='form'||ph==='text'){
      if(!p.star)continue;
      const g=ph==='text'?1:ease(clamp((f-p.dl)/.6));
      const sw=Math.sin(g*Math.PI)*p.sw*.6;
      const x=(p.tx+(p.gx-p.tx)*g)*cw+sw,y=(p.ty+(p.gy-p.ty)*g)*chh;
      const v=Math.sin(T*p.sp+p.tw);
      ctx.fillStyle=g<1?mix(STAR,[255,226,150],g):`rgb(255,${226+20*v|0},${160+50*v|0})`;
      ctx.globalAlpha=g<1?.75+.25*g:.8+.2*v;
      if(p.big&&g<.5){ctx.font=`600 ${fs*1.9}px "IBM Plex Mono",monospace`;ctx.fillText('*',x-fs*.3,y-fs*.4);ctx.font=font}
      else ctx.fillText(g<.9?(v>.5?'*':'+'):(v>-.4?'*':'+'),x,y);
      ctx.globalAlpha=1;continue;
    }
    let e;
    if(ph==='eye')e=0;else if(ph==='sky')e=1;
    else{
      const delay=ph==='out'?(p.d/maxD)*.45:(1-p.d/maxD)*.45;
      const raw=clamp((f-delay)/.55);
      e=ph==='out'?ease(raw):1-ease(raw);
    }
    if(e===0){
      if(open<1&&p.k&&Math.abs(p.hy-OY)>OH*open+.4)continue;
      ctx.fillStyle=p.col;ctx.fillText(p.ch,p.hx*cw,p.hy*chh);continue;
    }
    const sw=Math.sin(e*Math.PI)*p.sw;
    const ax=ph==='in'&&p.star?p.gx:p.tx,ay=ph==='in'&&p.star?p.gy:p.ty;
    const dx=ax-p.hx,dy=ay-p.hy,len=Math.hypot(dx,dy)||1;
    const x=(p.hx+dx*e-dy/len*sw)*cw,y=(p.hy+dy*e+dx/len*sw*.5)*chh;
    if(e<.1){ctx.fillStyle=p.col;ctx.fillText(p.ch,x,y);continue}
    if(p.star){
      const v=Math.sin(T*p.sp+p.tw);
      const g=clamp((e-.35)/.5);
      ctx.fillStyle=mix(p.rgb,STAR,g);
      ctx.globalAlpha=e<.9?.85:.55+.45*(v*.5+.5);
      if(p.big&&e>.9){ctx.font=`600 ${fs*1.9}px "IBM Plex Mono",monospace`;ctx.fillText(v>-.2?'*':'+',x-fs*.3,y-fs*.4);ctx.font=font}
      else ctx.fillText(e<.85?'.':v>.7?'*':v>0?'+':'.',x,y);
      ctx.globalAlpha=1;
    }else if(e<.8){
      ctx.globalAlpha=1-e/.8;ctx.fillStyle=p.col;ctx.fillText(e<.35?"'":'.',x,y);ctx.globalAlpha=1;
    }
  }
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
}
</script>
</body>
